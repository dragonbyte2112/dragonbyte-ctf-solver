<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DragonByte CTF AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e1c; --panel:#111830; --panel2:#161f3e; --border:#263157; --border2:#334073;
  --text:#e9edf9; --muted:#8891b3; --faint:#5b6488;
  --blue:#5b8cff; --purple:#9b6bff; --green:#35d399; --amber:#ffb648; --red:#ff5f7e;
  --sans:'Space Grotesk',system-ui,sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 500px at 15% -10%, rgba(91,140,255,.10), transparent 60%),
             radial-gradient(700px 500px at 100% 0%, rgba(155,107,255,.08), transparent 60%);}
.shell{position:relative;z-index:1;display:flex;min-height:100vh}
.sidebar{width:280px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);
  padding:18px 16px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:10px}
.brand .glyph{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,#1a244e,#211a4e);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;padding:2px}
.brand .glyph img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 6px rgba(91,140,255,.35))}
.brand b{font-size:15px;display:block}
.brand small{color:var(--faint);font-size:11px}
.dropzone{border:1.5px dashed var(--border2);border-radius:12px;padding:16px 12px;text-align:center;
  cursor:pointer;background:var(--panel2)}
.dropzone:hover,.dropzone.drag{border-color:var(--blue);background:#141c3a}
.dropzone .ico{font-size:20px;margin-bottom:6px}
.dropzone p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.filechip{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px}
.filechip .fname{font-family:var(--mono);word-break:break-all;font-size:12px}
.filechip .meta{color:var(--faint);margin-top:4px;font-size:11px}
.filechip .ftag{display:inline-block;margin-top:6px;background:#1a2a4e;color:var(--blue);border-radius:6px;padding:2px 7px;font-size:10.5px}
.filechip button{margin-top:8px;width:100%;background:transparent;border:1px solid var(--border);color:var(--muted);border-radius:7px;padding:5px;font-size:11px;cursor:pointer}
nav.tabs{display:flex;flex-direction:column;gap:3px}
nav.tabs button{display:flex;align-items:center;gap:9px;text-align:left;background:transparent;border:none;
  color:var(--muted);padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13.5px;font-family:var(--sans)}
nav.tabs button .dot{width:6px;height:6px;border-radius:50%;background:var(--faint)}
nav.tabs button.active{background:var(--panel2);color:var(--text)}
nav.tabs button.active .dot{background:var(--blue)}
.backend{margin-top:auto;border-top:1px solid var(--border);padding-top:12px}
.backend label{font-size:10.5px;color:var(--faint);display:block;margin-bottom:4px}
.backend input{width:100%;background:#0b1126;border:1px solid var(--border);color:var(--text);
  border-radius:7px;padding:6px 8px;font-size:11px;font-family:var(--mono)}
.backend .status{font-size:10.5px;margin-top:6px;color:var(--faint)}
.backend .status.ok{color:var(--green)}
.backend .status.bad{color:var(--red)}
.main{flex:1;min-width:0;padding:22px 26px 60px;max-width:860px}
.pagehead{margin-bottom:18px}
.pagehead h1{font-size:19px;margin:0 0 4px;font-weight:600}
.pagehead p{margin:0;color:var(--muted);font-size:13px;max-width:62ch}
.card{background:var(--panel);border:1px solid var(--border);border-radius:13px;padding:18px;margin-bottom:14px}
.card h2{font-size:12.5px;margin:0 0 12px;color:var(--faint);font-weight:600}
textarea,select{width:100%;background:#0b1126;border:1px solid var(--border);color:var(--text);border-radius:9px;padding:10px;font-family:var(--mono);font-size:13px}
textarea{min-height:88px;resize:vertical}
button.btn{background:linear-gradient(90deg,var(--blue),var(--purple));color:#fff;border:none;padding:9px 17px;border-radius:9px;cursor:pointer;font-size:13px;font-weight:600;font-family:var(--sans)}
button.btn:disabled{opacity:.5;cursor:not-allowed}
button.btn.ghost{background:transparent;border:1px solid var(--border2);color:var(--text)}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:10px;align-items:center}
.tag{display:inline-block;background:#1a2a4e;color:var(--blue);border-radius:7px;padding:3px 9px;font-size:11.5px;margin:2px 5px 2px 0;font-family:var(--mono)}
.tag.flag{background:#143329;color:var(--green);font-weight:600}
pre{background:#080c1a;border:1px solid var(--border);border-radius:9px;padding:11px;overflow-x:auto;font-size:12px;white-space:pre-wrap;word-break:break-word;margin:7px 0;font-family:var(--mono)}
.step{border-left:2px solid var(--purple);padding:5px 0 5px 12px;margin:8px 0;font-size:13px}
.cmdbox{position:relative}
.cmdbox pre{padding-right:64px}
.cmdbox button{position:absolute;top:8px;right:8px;font-size:11px;padding:4px 9px}
.muted{color:var(--muted);font-size:12.5px}
.empty{color:var(--faint);font-size:12.5px;padding:10px 0}
.aibox{background:linear-gradient(135deg,#141c38,#171a35);border:1px solid var(--border2);border-radius:11px;padding:14px;white-space:pre-wrap;font-size:13.5px;line-height:1.6}
.spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--border2);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:820px){
  .shell{flex-direction:column}
  .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--border)}
  nav.tabs{flex-direction:row;overflow-x:auto}
  .main{padding:18px 16px 50px;max-width:100%}
}
</style>
</head>

    <div>
      <div class="dropzone" id="dropzone"><div class="ico">📁</div><p><b>Drop a challenge file</b><br>or click to browse</p></div>
      <input type="file" id="fileInput" hidden>
      <div id="fileChipWrap" style="margin-top:10px"></div>
    </div>
    <nav class="tabs" id="nav"></nav>
    <div class="backend">
      <label>Backend URL</label>
      <input type="text" id="backendUrl" value="http://localhost:8000">
      <div class="status" id="backendStatus">Checking...</div>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
const views = [{k:"solver",label:"Solver"},{k:"toolkit",label:"Toolkit"}];
let active = "solver";
let currentFile = null;

const nav = document.getElementById("nav");
views.forEach(v=>{
  const b=document.createElement("button");
  b.innerHTML=`<span class="dot"></span>${v.label}`;
  b.onclick=()=>{active=v.k; render();};
  b.dataset.k=v.k;
  nav.appendChild(b);
});

function backendUrl(){ return document.getElementById("backendUrl").value.replace(/\/$/,""); }
async function checkBackend(){
  const el=document.getElementById("backendStatus");
  try{
    const r=await fetch(backendUrl()+"/api/health");
    const d=await r.json();
    el.textContent = d.ai_provider_configured ? `Connected · AI: ${d.ai_provider}` : "Connected · AI not configured";
    el.className = "status ok";
  }catch(e){
    el.textContent = "Backend unreachable — start it (see README)";
    el.className = "status bad";
  }
}
document.getElementById("backendUrl").addEventListener("change", checkBackend);

function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function toHex(bytes,len){return [...bytes.slice(0,len)].map(b=>b.toString(16).padStart(2,'0')).join('')}

function handleFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    currentFile = {name:file.name, size:file.size, raw:file, bytes:new Uint8Array(reader.result)};
    drawFileChip(); active="solver"; render();
  };
  reader.readAsArrayBuffer(file);
}
function drawFileChip(){
  const wrap=document.getElementById("fileChipWrap");
  if(!currentFile){wrap.innerHTML="";return;}
  wrap.innerHTML=`<div class="filechip">
    <div class="fname">${escapeHtml(currentFile.name)}</div>
    <div class="meta">${(currentFile.size/1024).toFixed(1)} KB</div>
    <button id="rmFile">Remove file</button>
  </div>`;
  document.getElementById("rmFile").onclick=()=>{currentFile=null;drawFileChip();render();};
}
const dz=document.getElementById("dropzone"), fi=document.getElementById("fileInput");
dz.onclick=()=>fi.click();
fi.onchange=()=>{if(fi.files[0])handleFile(fi.files[0])};
["dragover","dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{
  e.preventDefault();
  if(ev==="dragover")dz.classList.add("drag");
  if(ev==="dragleave")dz.classList.remove("drag");
  if(ev==="drop"){dz.classList.remove("drag"); if(e.dataTransfer.files[0])handleFile(e.dataTransfer.files[0]);}
}));

function render(){
  [...nav.children].forEach(b=>b.classList.toggle("active", b.dataset.k===active));
  drawFileChip();
  const m=document.getElementById("main");
  if(active==="solver") renderSolver(m);
  if(active==="toolkit") renderToolkit(m);
}

function renderSolver(m){
  const fileBlock = currentFile ? `
    <div class="card"><h2>Loaded File</h2>
      <div class="row" style="margin-top:0">
        <span class="tag">${escapeHtml(currentFile.name)}</span>
        <span class="tag">${(currentFile.size/1024).toFixed(1)} KB</span>
      </div>
      <h2 style="margin-top:14px">Hex Preview (first 64 bytes)</h2>
      <pre>${toHex(currentFile.bytes,64).match(/.{1,2}/g).join(' ')}</pre>
    </div>` : '';
  m.innerHTML = `
  <div class="pagehead"><h1>Solver</h1><p>Paste text or load a file, then run analysis. The deterministic engine and AI reasoning both run on your backend — covering all 9 CTF categories.</p></div>
  ${fileBlock}
  <div class="card">
    <h2>Text / Ciphertext Input</h2>
    <textarea id="inp" placeholder="Paste ciphertext, encoded text, or notes about the challenge...">${currentFile?'':'ZmxhZ3t0ZXN0X2ZsYWd9'}</textarea>
    <div class="row">
      <label class="muted" style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="useAi" checked> Use AI reasoning</label>
      <button class="btn" id="analyzeBtn">Run analysis</button>
      <button class="btn ghost" id="clearBtn">Clear</button>
    </div>
  </div>
  <div id="results"></div>`;
  document.getElementById("analyzeBtn").onclick=runAnalysis;
  document.getElementById("clearBtn").onclick=()=>{document.getElementById("inp").value="";document.getElementById("results").innerHTML="";};
}

const STATUS_COLOR = {ran:"var(--green)", not_installed:"var(--amber)", timeout:"var(--amber)", error:"var(--red)", aborted:"var(--red)"};

function renderEvidenceStep(ev){
  const color = STATUS_COLOR[ev.status] || "var(--muted)";
  const out = ev.output || {};
  let detailLines = [];
  // Pull out the most relevant fields per tool, in a sensible order, rather than dumping raw JSON.
  const fieldOrder = ["stdout", "decrypted", "estimated_key", "plaintext_guess", "plaintext_int",
                       "preview", "extracted_preview", "nx_stack", "pie", "relro", "stack_canary",
                       "arch", "stripped", "dns_queries", "http_sample", "packet_count",
                       "possible_types", "cracked", "password", "p", "q", "note", "error", "stderr"];
  for(const key of fieldOrder){
    if(out[key] !== undefined && out[key] !== "" && out[key] !== null){
      let val = out[key];
      if(Array.isArray(val)) val = val.join(", ");
      detailLines.push(`<div><span class="muted">${key}:</span> ${escapeHtml(String(val)).slice(0,400)}</div>`);
    }
  }
  return `<div class="step" style="border-left-color:${color}">
    <div><b>${escapeHtml(ev.tool)}</b> <span class="muted">— ${escapeHtml(ev.status)}</span></div>
    ${ev.command ? `<div class="muted" style="margin:3px 0">${escapeHtml(ev.command)}</div>` : ''}
    ${detailLines.length ? `<pre style="margin-top:6px">${detailLines.join('')}</pre>` : ''}
    ${ev.flags_found && ev.flags_found.length ? ev.flags_found.map(f=>`<span class="tag flag">${escapeHtml(f)}</span>`).join('') : ''}
  </div>`;
}

async function runAnalysis(){
  const results=document.getElementById("results");
  const text=document.getElementById("inp").value;
  const useAi=document.getElementById("useAi").checked;
  if(!text.trim() && !currentFile){ results.innerHTML='<div class="card empty">Nothing to analyze — paste text or load a file.</div>'; return; }

  results.innerHTML = `<div class="card"><span class="spinner"></span>Running real tools${useAi?' and contacting AI':''}...</div>`;

  const form=new FormData();
  form.append("text", text);
  form.append("use_ai", useAi ? "true" : "false");
  if(currentFile) form.append("file", currentFile.raw, currentFile.name);

  let data;
  try{
    const r = await fetch(backendUrl()+"/api/analyze", {method:"POST", body: form});
    data = await r.json();
  }catch(e){
    results.innerHTML = `<div class="card"><h2>Backend unreachable</h2><div class="muted">Could not reach ${escapeHtml(backendUrl())}. Make sure the FastAPI backend is running (see README), then try again.</div></div>`;
    return;
  }

  if(data.error){ results.innerHTML = `<div class="card"><h2>Error</h2><div class="muted">${escapeHtml(data.error)}</div></div>`; return; }

  const res = data.result;
  let html = `<div class="card"><h2>Detected Category</h2><span class="tag">${escapeHtml(res.category)}</span>
    <span class="tag">${res.steps_run} step${res.steps_run===1?'':'s'} run</span>
    ${res.steps_limit_hit?'<span class="tag" style="color:var(--amber)">step limit reached</span>':''}
    ${res.time_limit_hit?'<span class="tag" style="color:var(--amber)">time budget reached</span>':''}
    </div>`;

  html += `<div class="card"><h2>Evidence — Real Tool Execution</h2>` +
    res.evidence.map(renderEvidenceStep).join('') + `</div>`;

  html += `<div class="card"><h2>Flag Candidates (all steps)</h2>` +
    (res.all_flag_candidates.length ? res.all_flag_candidates.map(f=>`<span class="tag flag">${escapeHtml(f)}</span>`).join('')
      : '<div class="empty">No flag-format matches yet — not a confirmed negative, some techniques may need manual follow-up.</div>') + `</div>`;

  if(useAi){
    if(data.ai && data.ai.available){
      html += `<div class="card"><h2>AI Analysis (${escapeHtml(data.ai.provider)})</h2><div class="aibox">${escapeHtml(data.ai.text)}</div></div>`;
    } else {
      html += `<div class="card"><h2>AI Analysis</h2><div class="muted">AI unavailable: ${escapeHtml(data.ai ? data.ai.error : 'unknown error')}</div></div>`;
    }
  }

  results.innerHTML = html;
}

let TOOLKIT_CACHE = null;
async function renderToolkit(m){
  m.innerHTML = `<div class="pagehead"><h1>Toolkit</h1><p>Command reference for every category, served live from the backend.</p></div><div id="tkBody" class="card">Loading...</div>`;
  if(!TOOLKIT_CACHE){
    try{ TOOLKIT_CACHE = await (await fetch(backendUrl()+"/api/toolkit")).json(); }
    catch(e){ document.getElementById("tkBody").innerHTML = '<div class="muted">Backend unreachable.</div>'; return; }
  }
  const cats = Object.keys(TOOLKIT_CACHE);
  document.getElementById("tkBody").outerHTML = `<div class="card"><h2>Category</h2>
    <select id="catSel">${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div id="cmds"></div>`;
  const draw=()=>{
    const cat=document.getElementById("catSel").value;
    document.getElementById("cmds").innerHTML = `<div class="card"><h2>${cat}</h2>` +
      TOOLKIT_CACHE[cat].map(c=>`<div class="muted" style="margin-top:10px">${c.label}</div>
        <div class="cmdbox"><pre>${escapeHtml(c.command)}</pre><button class="btn ghost copyBtn" data-cmd="${encodeURIComponent(c.command)}">Copy</button></div>`).join('') + `</div>`;
    document.querySelectorAll(".copyBtn").forEach(b=>b.onclick=()=>{
      navigator.clipboard?.writeText(decodeURIComponent(b.dataset.cmd)).catch(()=>{});
      b.textContent="Copied"; setTimeout(()=>b.textContent="Copy",1200);
    });
  };
  document.getElementById("catSel").onchange=draw; draw();
}

render();
checkBackend();
</script>
